name: Update Profile README

on:
  schedule:
    # Esegue il workflow ogni 6 ore
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permette l'avvio manuale dalla scheda Actions su GitHub
  push:
    branches:
      - main
      - master
    paths:
      - 'update_readme.py'
      - '.github/workflows/update-readme.yml'

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Richiesto per poter fare il push delle modifiche sul repository

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Update Script
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python update_readme.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md github_stats.svg
          # Esegue il commit solo se il file README.md ha subito modifiche
          git diff-index --quiet HEAD || (git commit -m "docs: update README.md statistics [skip ci]" && git push)
